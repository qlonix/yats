[package]
name = "yats"
version = "1.3.5"
description = "Yet Another Touchpad Shortcut"
authors = ["QLO (qlonix)"]
license = "MIT"
homepage = "https://github.com/qlonix/yats"
repository = "https://github.com/qlonix/yats"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { version = "0.5", features = ["unstable_grab", "serialize"] }
enigo = { version = "0.3", features = ["x11rb"] }
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "hidpi", "shlobj", "libloaderapi"] }
winreg = "0.52"

[target.'cfg(unix)'.dependencies]
evdev = "0.12"
nix = { version = "0.27", features = ["user"] }

