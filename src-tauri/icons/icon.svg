<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  {/* Simple, Bold Touchpad Outline */}
  <rect x="120" y="200" width="784" height="624" rx="80" fill="url(#iconGrad)" />
  
  {/* Bold Keyboard Icons (simplified to 3 blocks) */}
  <rect x="220" y="300" width="180" height="180" rx="40" fill="white" />
  <rect x="422" y="300" width="180" height="180" rx="40" fill="white" />
  <rect x="624" y="300" width="180" height="180" rx="40" fill="white" />

  {/* Bold Touch Indicator (thick stroke) */}
  <circle cx="512" cy="650" r="60" fill="none" stroke="white" stroke-width="40" />
  <circle cx="512" cy="650" r="20" fill="white" />
</svg>
